name: Yoru - Build (Windows)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # run by hand from the Actions tab

permissions:
  contents: write # only used by the tag -> GitHub Release step

env:
  CARGO_TERM_COLOR: always
  # link FFmpeg dynamically (import libs from vcpkg) and ship the DLLs next to the exe
  VCPKGRS_DYNAMIC: "1"
  # bindgen (used by ffmpeg-sys-next) needs libclang; preinstalled on windows-latest
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ---- FFmpeg via vcpkg (first run ~15-25 min, then restored from cache in seconds) ----
      - name: Configure vcpkg + binary cache location
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          $cache = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          # bump the suffix to force a fresh FFmpeg build
          key: vcpkg-ffmpeg-x64-windows-${{ runner.os }}-v2

      - name: Install FFmpeg (D3D11VA/DXVA2 + optional NVDEC)
        shell: pwsh
        run: |
          # Windows vcpkg builds enable the native D3D11VA/DXVA2 paths when supported.
          # nvcodec adds NVIDIA's headers so CUDA/NVDEC can be used on systems with a compatible GPU.
          & "$env:VCPKG_ROOT\vcpkg.exe" install "ffmpeg[nvcodec]:x64-windows"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg FFmpeg install failed" }

      # ---- regression tests ----
      - name: cargo test --release
        run: cargo test --release

      # ---- build ----
      - name: cargo build --release
        run: cargo build --release

      # ---- package: one self-extracting app executable, then one ZIP release asset ----
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force payload | Out-Null
          Copy-Item target\release\yoru.exe payload\yoru-app.exe
          Copy-Item "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" payload\

          # The Rust decoder links to vcpkg's FFmpeg DLLs. Export and proxy creation use a
          # separate static CLI build so end users do not need to install FFmpeg themselves.
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg-cli.zip
          Expand-Archive -Path ffmpeg-cli.zip -DestinationPath ffmpeg-cli -Force
          $ffmpeg = Get-ChildItem ffmpeg-cli -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (-not $ffmpeg) { throw "The FFmpeg CLI archive did not contain ffmpeg.exe" }
          Copy-Item $ffmpeg.FullName payload\ffmpeg.exe
          $docs = Get-ChildItem ffmpeg-cli -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|README)' }
          foreach ($doc in $docs) {
            $destName = "FFmpeg_" + $doc.Name
            if (-not (Test-Path (Join-Path payload $destName))) { Copy-Item $doc.FullName (Join-Path payload $destName) }
          }
          @'
          FFmpeg CLI build bundled with Yoru
          Source project: https://github.com/BtbN/FFmpeg-Builds
          Asset: ffmpeg-n9.0-latest-win64-gpl-9.0.zip (Windows x86_64, static GPL build)
          Used for MP4 export and preview-proxy creation. The decoder bindings also use the FFmpeg
          libraries installed from vcpkg during the build. Consult the bundled FFmpeg license files
          and build project's licensing information before redistributing modified packages.
          '@ | Set-Content -Encoding UTF8 (Join-Path payload "FFmpeg-BUILD-NOTICE.txt")

          # IExpress creates a single EXE containing the app and its runtime files. It extracts
          # them to a temporary folder and starts the app there, so FFmpeg DLL loading and the
          # ffmpeg.exe export helper continue to work without a separate installer.
          $iexpress = Join-Path $env:WINDIR "System32\iexpress.exe"
          if (-not (Test-Path $iexpress)) { throw "IExpress is required to make the single-file package" }
          $sedLines = [System.Collections.Generic.List[string]]::new()
          $payloadFiles = @(Get-ChildItem payload -File)
          $payloadDir = (Resolve-Path payload).Path.TrimEnd('\') + '\'
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "Yoru.exe"
          $sedLines.Add('[Version]')
          $sedLines.Add('Class=IEXPRESS')
          $sedLines.Add('SEDVersion=3')
          $sedLines.Add('[Options]')
          $sedLines.Add('PackagePurpose=InstallApp')
          $sedLines.Add('ShowInstallProgramWindow=1')
          $sedLines.Add('HideExtractAnimation=1')
          $sedLines.Add('UseLongFileName=1')
          $sedLines.Add('InsideCompressed=0')
          $sedLines.Add('CAB_FixedSize=0')
          $sedLines.Add('CAB_ResvCodeSigning=0')
          $sedLines.Add('RebootMode=N')
          $sedLines.Add('InstallPrompt=%InstallPrompt%')
          $sedLines.Add('DisplayLicense=%DisplayLicense%')
          $sedLines.Add('FinishMessage=%FinishMessage%')
          $sedLines.Add('TargetName=%TargetName%')
          $sedLines.Add('FriendlyName=%FriendlyName%')
          $sedLines.Add('AppLaunched=%AppLaunched%')
          $sedLines.Add('PostInstallCmd=%PostInstallCmd%')
          $sedLines.Add('AdminQuietInstCmd=%AdminQuietInstCmd%')
          $sedLines.Add('UserQuietInstCmd=%UserQuietInstCmd%')
          $sedLines.Add('SourceFiles=SourceFiles')
          $sedLines.Add('[Strings]')
          $sedLines.Add('InstallPrompt=')
          $sedLines.Add('DisplayLicense=')
          $sedLines.Add('FinishMessage=')
          $sedLines.Add(('TargetName=' + $packagePath))
          $sedLines.Add('FriendlyName=Yoru Video Editor')
          $sedLines.Add('AppLaunched=yoru-app.exe')
          $sedLines.Add('PostInstallCmd=<None>')
          $sedLines.Add('AdminQuietInstCmd=')
          $sedLines.Add('UserQuietInstCmd=')
          for ($i = 0; $i -lt $payloadFiles.Count; $i++) {
            $sedLines.Add(('FILE' + $i + '="' + $payloadFiles[$i].Name + '"'))
          }
          $sedLines.Add('[SourceFiles]')
          $sedLines.Add(('SourceFiles0=' + $payloadDir))
          $sedLines.Add('[SourceFiles0]')
          for ($i = 0; $i -lt $payloadFiles.Count; $i++) { $sedLines.Add("%FILE$i%=") }
          Set-Content -Path yoru.sed -Value $sedLines -Encoding ASCII
          & $iexpress /N /Q (Join-Path $env:GITHUB_WORKSPACE "yoru.sed")
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $packagePath)) { throw "IExpress failed to create $packagePath from yoru.sed" }
          Compress-Archive -Path $packagePath -DestinationPath yoru-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: yoru-windows-x64
          path: yoru-windows-x64.zip
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: yoru-windows-x64.zip
          generate_release_notes: true
