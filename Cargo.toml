[package]
name = "yoru"
version = "0.1.0"
edition = "2021"
description = "Yoru - video editor"

[dependencies]
eframe = "0.29"
# The crate's major.minor tracks FFmpeg's (9.0 <-> FFmpeg 9.0). vcpkg in CI installs the
# newest FFmpeg, so keep this in step with it. "~9.0" = any 9.0.x, never a surprise 9.1.
ffmpeg-next = "~9.0"
cpal = "0.15"
rfd = "0.15"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.dev]
opt-level = 1

# FFmpeg bindings + decode glue are hot paths even in debug: optimise deps, keep your code debuggable
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
